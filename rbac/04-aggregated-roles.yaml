# Aggregated ClusterRoles
# Add a labeled fragment ClusterRole and the parent picks it up automatically.

# AGGREGATION PARENT: custom-view
# Collects ClusterRoles labeled rbac.security/aggregate-to-view: "true".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-custom-view
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      rbac.security/aggregate-to-view: "true"
rules: []   # auto-populated by aggregation controller

---
# FRAGMENT: Kyverno policy viewer
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-kyverno-viewer
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
    rbac.security/aggregate-to-view: "true"
rules:
- apiGroups: ["kyverno.io"]
  resources:
  - clusterpolicies
  - policies
  - policyexceptions
  verbs: ["get", "list", "watch"]
- apiGroups: ["wgpolicyk8s.io"]
  resources:
  - policyreports
  - clusterpolicyreports
  verbs: ["get", "list", "watch"]

---
# FRAGMENT: Certificate viewer (cert-manager)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-cert-viewer
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
    rbac.security/aggregate-to-view: "true"
rules:
- apiGroups: ["cert-manager.io"]
  resources:
  - certificates
  - issuers
  - clusterissuers
  - certificaterequests
  verbs: ["get", "list", "watch"]
