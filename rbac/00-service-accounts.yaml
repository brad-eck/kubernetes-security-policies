# Service Accounts
# Purpose-scoped accounts — avoid using "default" in any namespace.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-workload
  namespace: production
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
    rbac.security/persona: workload
automountServiceAccountToken: false   # opt-in only — pods that need the
                                      # token must explicitly set this to true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy
  namespace: production
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
    rbac.security/persona: ci-cd
automountServiceAccountToken: true    # CI pipelines need the token to
                                      # interact with the API server

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
    rbac.security/persona: monitoring
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kubernetes-security-policies
    rbac.security/persona: monitoring
automountServiceAccountToken: true
