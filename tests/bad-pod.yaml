---
# bad-pod.yaml - A deliberately insecure pod that violates multiple policies
#
# This pod should FAIL and be BLOCKED by Kyverno policies.

apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
  labels:
    app: bad-app
spec:
  hostNetwork: true
  
  hostPID: true
  
  hostIPC: true
  
  containers:
  - name: bad-container
    image: alpine:latest    
    
    securityContext:
      privileged: true
      
      allowPrivilegeEscalation: true
      
      runAsUser: 0
      
      capabilities:
        add:
          - SYS_ADMIN
          - NET_ADMIN
          - SYS_PTRACE
          - SYS_MODULE
    
    command: ["/bin/sh"]
    args: ["-c", "while true; do sleep 30; done"]
  
  automountServiceAccountToken: true