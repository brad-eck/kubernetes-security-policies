---
# good-pod.yaml — should pass all Kyverno policies.

apiVersion: v1
kind: Pod
metadata:
  name: compliant-nginx
  labels:
    app: nginx
    owner: platform-team
    team: infrastructure
    environment: dev
    version: "1.25.3"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  
  containers:
  - name: nginx
    image: nginx:1.25.3
    
    imagePullPolicy: IfNotPresent
    
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    
    ports:
    - containerPort: 8080
      name: http
      protocol: TCP
    
    volumeMounts:
    - name: cache
      mountPath: /var/cache/nginx
    - name: run
      mountPath: /var/run
    - name: tmp
      mountPath: /tmp
    
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
    
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
  
  volumes:
  - name: cache
    emptyDir: {}
  - name: run
    emptyDir: {}
  - name: tmp
    emptyDir: {}
  
  automountServiceAccountToken: false
  
  dnsPolicy: ClusterFirst
  
  restartPolicy: Always
  
  hostNetwork: false
  hostPID: false
  hostIPC: false